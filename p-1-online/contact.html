<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
     <div id="contact.html"></div>
   <h2>Contact </h2>
   <form action="/submit" method="POST">
    <div class="form-group">
         <label for="fname">Full Name *</label>
        <input type="text" id="fname" name="full_name" placeholder="Rahul Sharma" required>
    </div>

   <div class="form-group">
    <label for="email">Email Address *</label>
    <input type="email" id="email" name="email" placeholder="rahul@example.com" required>
  </div>

  <div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210">
  </div>

  <div class="form-group">
    <label for="service">Service Required</label>
    <select id="service" name="service">
      <option value="">Select a service</option>
      <option>Web Development</option>
      <option>Mobile App</option>
      <option>UI/UX Design</option>
    </select>
  </div>

  <div class="form-group">
    <label for="msg">Message *</label>
    <textarea id="msg" name="message" placeholder="Tell us about your project..." required></textarea>
  </div>

  <button type="submit">Send Message</button>

</form>
<li><a href="index.html">Home</a></li>
</div>
</body>
</html>
